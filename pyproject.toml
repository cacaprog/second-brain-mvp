[project]
name = "second-brain"
version = "2.0.0"
description = "Local-first Zettelkasten knowledge system with LLM-powered wiki compilation"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "python-dateutil",
    "langdetect",
    "pyyaml",
    "ollama",
    "sentence-transformers",
    "chromadb",
    "watchdog",
    "rich",
    "fastmcp",
    "gradio",
    "torch>=2.5.0",
    "python-dotenv>=1.2.2",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
